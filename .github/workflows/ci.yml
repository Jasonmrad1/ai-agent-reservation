name: Clinic reliability
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - run: npm test -- --silent
      - run: npm run build
      - run: npm audit --audit-level=moderate
